     <td><input class="set-owner" data-i="${i}" value="${esc(t.owner)}"></td></tr>`).join("")}</tbody></table>
   <div class="ctlrow"><button class="bigbtn" id="setSave">Save setup</button>
   <span class="muted">Team order = nomination order.</span></div>`;
  /* ---------- the league's announcer voice, set here and nowhere else ----------
     Kap, 8/4: "fix it so everyone hears the same voice which should be dictated at the
     auction operator page. I don't want the toggle anywhere else."

     So the voice lives in `S.settings.ttsVoice` — draft state, which already rides
     DDSync out to every phone and the room screen. Change it here and every dashboard
     announces in the new voice within a sync tick; no per-device setting to drift, and
     nothing for a leaguemate to fiddle with mid-draft.

     Empty means the Worker's ELEVEN_VOICE (currently Pepperoni), which is the escape
     hatch if this page is not the one running the draft. */
  const vsel=sp.querySelector("#setVoice"), vmsg=sp.querySelector("#voiceMsg");
  let VOICE_LIST=[];
  function paintVoiceList(){
    const cur=S.settings.ttsVoice||"";
    // The Worker already strips ElevenLabs' ~21 stock voices; this repeats the filter
    // because it is one predicate and the failure mode is Kap re-opening this dropdown
    // to find Bella and Roger back in it. Two cheap filters beat one load-bearing one.
    const mine=VOICE_LIST.filter(v=>v.category!=="premade");
    vsel.innerHTML='<option value="">House voice (Worker default)</option>'
      + mine.map(v=>`<option value="${esc(v.id)}" ${cur===v.id?"selected":""}>${esc(v.name)}</option>`).join("");
    // A voice deleted in ElevenLabs must not stay selected — it would 502 every
    // announcement for the whole league and the operator would never see it.
    if(cur && !mine.some(v=>v.id===cur)){ S.settings.ttsVoice=""; vsel.value=""; save(); }
  }
  (async()=>{
    const pass=localStorage.getItem("dd-bot-pass");
    if(!pass){ vsel.innerHTML='<option value="">House voice (Worker default)</option>';
      vmsg.innerHTML="Enter the league passphrase in <b>Ask Toto</b> to choose a voice. Until then the league hears the Worker's default."; return; }
    try{
      const r=await fetch("https://toto.jkapcar4.workers.dev/tts/voices",{headers:{"X-Dawg-Pass":pass}});
      const d=await r.json();
      if(!r.ok || !Array.isArray(d.voices) || !d.voices.length){
        vsel.innerHTML='<option value="">House voice (Worker default)</option>';
        vmsg.textContent="Couldn't load the voice list — the league stays on the house voice."; return;
      }
      VOICE_LIST=d.voices; paintVoiceList();
    }catch(e){ vsel.innerHTML='<option value="">House voice (Worker default)</option>'; }
  })();
  // Apply on change, not on "Save setup" — this is the one setting people will want to
  // flip mid-draft, and making them find a save button to do it invites the mistake.
  vsel.addEventListener("change",()=>{ S.settings.ttsVoice=vsel.value; save(); });

  sp.querySelector("#voiceTest").addEventListener("click",async()=>{
    const pass=localStorage.getItem("dd-bot-pass");
    const line="Sold! Jahmyr Gibbs, 81 dollars, to Data Dawgs. That is criminal.";
    const btn=sp.querySelector("#voiceTest"); const was=btn.textContent;
    btn.textContent="…";
    try{
      if(!pass) throw new Error("no pass");
      const vid=vsel.value;
      const r=await fetch("https://toto.jkapcar4.workers.dev/tts",{method:"POST",
        headers:{"Content-Type":"application/json","X-Dawg-Pass":pass},
        body:JSON.stringify(vid?{text:line,voice:vid}:{text:line})});
      if(!r.ok || !(r.headers.get("content-type")||"").includes("audio")) throw new Error("tts "+r.status);
      const a=new Audio(URL.createObjectURL(await r.blob()));
      await new Promise(res=>{ a.onended=res; a.onerror=res; a.play().catch(res); setTimeout(res,20000); });
    }catch(e){
      // Degrade exactly the way the room would, so a silent-ish preview is informative
      // rather than mysterious: hearing the robot here means the league hears it too.
      speak(line);
    }
    btn.textContent=was;
  });
  // Dry-run the whole celebration — confetti and horn — without faking a sale.
  // Check this on the projector too: that machine is usually the one wired to
  // the room, and its speakers are the ones that matter.
  sp.querySelector("#hornTest").addEventListener("click",()=>{
    celebrate({player:"TEST — Myles Garrett", price:41});
  });
  sp.querySelector("#syncSave").addEventListener("click",()=>{
    if(!window.DDSync) return;
    DDSync.save(sp.querySelector("#setSyncUrl").value, sp.querySelector("#setSyncRoom").value);
    sp.querySelector("#syncLink").value = DDSync.link("board.html?view=live");
    const m=sp.querySelector("#syncMsg");
    if(DDSync.on){
      m.textContent = "Saved. Publishing…";
      DDSync.push(S);
      fetch(DDSync.endpoint()).then(r=>{
        m.textContent = r.ok ? "✓ Live mirror ON — send the link below to the league."
                             : "⚠ Saved, but the database rejected the read (check your rules allow read/write).";
      }).catch(()=>{ m.textContent="⚠ Saved, but couldn't reach that URL. Check it and your network."; });
    } else { m.textContent = "Off — enter a Firebase Realtime Database URL to enable."; }
  });
  sp.querySelector("#syncCopy").addEventListener("click",()=>{
    const el=sp.querySelector("#syncLink");
    el.select(); el.setSelectionRange(0,99999);
    (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject())
      .then(()=>{ sp.querySelector("#syncMsg").textContent="Link copied — text it to the league."; })
      .catch(()=>{ try{ document.execCommand("copy"); sp.querySelector("#syncMsg").textContent="Link copied."; }catch(e){} });
  });
  sp.querySelector("#aiSaveBtn").addEventListener("click",()=>{
    DDBot.saveCfg(sp.querySelector("#setAiUrl").value, sp.querySelector("#setAiKey").value, sp.querySelector("#setAiModel").value);
    const m=sp.querySelector("#aiMsg");
    m.textContent = DDBot.cfg().key
      ? "✓ Saved. Open 🤖 AI in the header and ask a test question."
      : "Saved, but no key — Toto stays off until one is pasted.";
  });
  sp.querySelector("#setSave").addEventListener("click",()=>{
    S.settings.budget=Math.max(1,+sp.querySelector("#setBudget").value||200);
    S.settings.spots=Math.max(1,+sp.querySelector("#setSpots").value||15);
    S.settings.scoring=sp.querySelector("#setScoring").value;
    S.settings.timerSecs=Math.max(3,+sp.querySelector("#setTimer").value||15);
    S.settings.myTeam=+sp.querySelector("#setMy").value;
    S.settings.announcer=sp.querySelector("#setAnn").checked;
    S.settings.snark=sp.querySelector("#setSnark").checked;
    // ⚠️ #setVoice is now an ElevenLabs voice id, NOT a speechSynthesis voice name.
    // It applies on `change` already; writing it here too keeps Save setup honest
    // rather than appearing to discard the selection. `voiceName` is left alone —
    // it is dead weight from the browser-voice era, harmless, and not worth a
    // migration on state that is already live in the league's Firebase room.
    S.settings.ttsVoice=sp.querySelector("#setVoice").value;
    sp.querySelectorAll(".set-name").forEach(el=>S.settings.teams[+el.dataset.i].name=el.value.trim()||("Team "+(+el.dataset.i+1)));
    sp.querySelectorAll(".set-owner").forEach(el=>S.settings.teams[+el.dataset.i].owner=el.value.trim());
    save(); renderOp();
  });
}

function renderRecap(rb){
  const d=derive();
  const sales=S.picks.filter(p=>!p.keeper && p.etr>0);
  const byDiff=[...sales].sort((a,b)=>(a.price-a.etr)-(b.price-b.etr));
  const steals=byDiff.slice(0,5), overs=byDiff.slice(-5).reverse();
  const team=i=>S.settings.teams[i]?S.settings.teams[i].name:"?";
  const posSpend={};
  S.picks.forEach(pk=>{ posSpend[pk.pos]=(posSpend[pk.pos]||0)+pk.price; });
  const g=gradesData(d);
  rb.innerHTML=`<h3>Recap</h3>
   <div style="font-size:13px"><b>Report card</b>${g.map((r,i)=>`<div class="bestrow">${i+1}. ${esc(r.name)}<span style="color:${r.surplus>=0?"var(--good)":"var(--bad)"};font-size:12px">${r.surplus>=0?"+":"−"}$${Math.abs(Math.round(r.surplus))}</span><span class="val">${r.grade}</span></div>`).join("")}
   <b style="display:block;margin-top:8px">Biggest steals</b>${steals.map(p=>`<div class="bestrow">${esc(p.player)} — ${esc(team(p.ti))}<span class="val" style="color:var(--good)">−$${p.etr-p.price}</span></div>`).join("")||"<div class='muted'>—</div>"}
   <b style="display:block;margin-top:8px">Biggest overpays</b>${overs.filter(p=>p.price>p.etr).map(p=>`<div class="bestrow">${esc(p.player)} — ${esc(team(p.ti))}<span class="val" style="color:var(--bad)">+$${p.price-p.etr}</span></div>`).join("")||"<div class='muted'>—</div>"}
   <b style="display:block;margin-top:8px">$ by position</b>${Object.entries(posSpend).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div class="bestrow">${p}<span class="val">${fmt$(v)}</span></div>`).join("")}
   <b style="display:block;margin-top:8px">Yahoo read-off (by team)</b>
   ${S.settings.teams.map((t,ti)=>{
      const ps=S.picks.filter(p=>p.ti===ti);
      if(!ps.length) return "";
      return `<div style="margin-top:4px"><b>${esc(t.name)}</b>: ${ps.map(p=>`${esc(p.player)} $${p.price}`).join(", ")}</div>`;
   }).join("")}</div>`;
}

// ---------- SUPER BOWL SUPER BROWNS ----------
// The horn is a real recording, not TTS. Preloaded at page load so the first
// Browns pick of the night doesn't wait on a 120KB download mid-celebration.
const SBSB_URL = "superbowlsuperbrowns.m4a";
// The file measures -11.3 LUFS — hot, several dB above the announcer voice.
// That is deliberate on a celebration, but this is the knob if the room says
// otherwise. Set to 1 for the file as recorded.
const SBSB_VOL = 0.85;
try{ const pre=new Audio(SBSB_URL); pre.preload="auto"; }catch(e){}
let cbSeenTs=null;
function nflOf(pk){ if(pk.nfl) return pk.nfl; const p=byName[pk.player]; return p?p.team:""; }
function checkBrowns(){
  const last=S.picks.length?S.picks[S.picks.length-1]:null;
  if(cbSeenTs===null){ cbSeenTs=last?last.ts:0; return; }   // don't replay on page load
  if(last && last.ts>cbSeenTs){
    cbSeenTs=last.ts;
    if(!last.keeper && nflOf(last)==="CLE") celebrate(last);
  }
}
function celebrate(pk){
  const old=document.getElementById("celebrate"); if(old) old.remove();
  const o=document.createElement("div"); o.id="celebrate";
  o.innerHTML=`<canvas></canvas>
    <div class="cb-line cb-1">SUPER BOWL</div>
    <div class="cb-line cb-2">SUPER BROWNS</div>
    <div class="cb-p">${esc(pk.player)} · $${pk.price} · THE LAND HAS SPOKEN</div>`;
  document.body.appendChild(o);
  const cv=o.querySelector("canvas"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const COLS=["#ff3c00","#ffffff","#e8720c","#5c4033","#ffb27a"];
  const parts=Array.from({length:220},()=>({
    x:innerWidth/2+(Math.random()-.5)*innerWidth*.5, y:innerHeight*.62,
    vx:(Math.random()-.5)*16, vy:-(6+Math.random()*15),
    s:4+Math.random()*7, c:COLS[(Math.random()*COLS.length)|0],
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.35}));
  let frames=0;
  const iv=setInterval(()=>{
    frames++;
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6); ctx.restore();
    });
    if(frames>170) clearInterval(iv);      // particles have fallen off screen
  }, 26);

  // The overlay now outlives the confetti so the horn can finish. 7.5s of audio
  // against 4.4s of particles read as the celebration dying mid-shout.
  const done=()=>{ clearInterval(iv); const el=document.getElementById("celebrate"); if(el) el.remove(); };

  // ⚠️ The horn fires in BOTH views on purpose (Kap, 8/4). The operator laptop is
  // often muted and the projector is what's wired to the room, so gating it to one
  // window risks the celebration landing silent. Two devices unmuted will echo
  // slightly — that is the accepted trade, not a bug to "fix".
  let horn=null;
  try{ horn=new Audio(SBSB_URL); horn.volume=SBSB_VOL; }catch(e){}
  if(!horn){ setTimeout(done, 4600); return; }
  horn.addEventListener("ended", done);
  // Autoplay needs a prior user gesture. The operator just clicked to record the
  // sale, so this is satisfied in practice — but never let a blocked play()
  // leave the overlay stuck on screen.
  horn.play().catch(()=>{});
  setTimeout(done, 11000);                 // hard stop if the file never loads
}

// ---------- boot & sync ----------
function render(){ IS_PROJ ? renderProj() : renderOp(); checkBrowns(); if(window.DDTheme) window.DDTheme.apply(); }
addEventListener("storage",e=>{ if(e.key===LS_STATE){ load(); render(); } });
// Big Board can live on a second device: mirror the operator's state down to it
if(IS_PROJ && window.DDSync && window.DDSync.on){
  window.DDSync.subscribe(state=>{
    if(!state || !state.settings) return;
    try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); }catch(e){}
    load(); render();
  });
}
if(IS_PROJ){ setInterval(()=>{ if(S.timerEnd>Date.now()-2000 && S.timerEnd>0) render(); }, 500); }
render();
</script>
<script>
/* ---- embedded-in-dashboard mode: the shell owns the chrome ----
   Ported from board.html 8/5 so Auctioneer Controls can be a Dashboard tab. Same
   contract as the other four views: hide our own chrome, post our height up, accept
   the shell's theme down. The page stays fully functional standalone at /auction.html
   — that is still how draft night runs on the operator machine. */
(function(){
  if(!/[?&]embed=1/.test(location.search)) return;
  document.documentElement.classList.add("dd-embed");
  const css = document.createElement("style");
  css.textContent = ".dd-embed .sitenav,.dd-embed footer,.dd-embed #ddbLaunch,.dd-embed #ddmeChip{display:none!important}"
    + ".dd-embed body{background:transparent}"
    + ".dd-embed .wrap{padding:0 0 14px;max-width:none}";
  document.head.appendChild(css);
  const post = () => {
    const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    parent.postMessage({dd:"height", h}, location.origin);
  };
  addEventListener("load", post);
  addEventListener("resize", post);
  if(window.ResizeObserver) new ResizeObserver(post).observe(document.body);
  /* ⚠️ The operator page rewrites large blocks on every pick, and a bid can land from
     DDSync with no DOM event we observe. The interval is the honest safety net, same
     as the other views. */
  setInterval(post, 900);
  addEventListener("message", e=>{
    if(e.origin!==location.origin || !e.data || e.data.dd!=="theme") return;
    document.documentElement.setAttribute("data-theme", e.data.theme);
    if(window.DDTheme && DDTheme.apply) DDTheme.apply();
    setTimeout(post, 60);
  });
})();
</script>
