<!-- Settings became a SHEET of survivor.html on 8/6/26. This stub stays because the
     old URL was live, sat in sw.js CORE, and may be bookmarked or already cached on a
     phone. Deleting it would 404 those; a redirect costs 400 bytes.
     ⚠️ replace(), not href = — assigning would leave the stub in history and trap the
     back button in a loop between the two. -->
<script>/* ⚠️ Query string goes BEFORE the fragment. Appending location.search after
     "#settings" produces "#settings?v=abc", which is not a known sheet id, so the
     sheet router falls back to the first sheet and the redirect silently lands on
     the wrong surface. Caught live, not by the suite — the test navigated without
     a query string. */
location.replace("survivor.html"+location.search+"#settings");</script>
