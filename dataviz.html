<style>
:root{
  color-scheme: dark;
  --surface-1:#16120d; --page:#0a0806;
  --ink-1:#f5f1ea; --ink-2:#c8c1b4; --ink-3:#8f897d;
  --grid:#2b251d; --axis:#3b3428; --border:rgba(255,255,255,0.10);
  --accent:#ff6a02; --accent-ink:#140a02;
  --good:#2fbf3f; --bad:#ff6b6b; --warn:#eda100;
}
:root[data-theme="light"]{
  color-scheme: light;
  --surface-1:#fffdf9; --page:#f8f4ee;
  --ink-1:#171310; --ink-2:#544e45; --ink-3:#8a8378;
  --grid:#e6dfd4; --axis:#c8c0b2; --border:rgba(23,19,16,0.12);
  --accent:#c2410c; --accent-ink:#ffffff;
  --good:#006300; --bad:#d03b3b; --warn:#b97a00;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink-1);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
/* ---- site nav ---- */
.sitenav{display:flex;align-items:center;gap:22px;padding:14px 0;border-bottom:1px solid var(--grid);margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink-1)}
.brand img{width:34px;height:42px;object-fit:contain}
.brand .logo{font-size:19px;font-weight:800;letter-spacing:.02em}
.brand .logo span{color:var(--accent)}
.brand .tag{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;align-self:center}
.sitenav .links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.sitenav .links a{color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:550}
.sitenav .links a:hover{background:color-mix(in srgb, var(--accent) 10%, transparent);color:var(--ink-1)}
.sitenav .links a.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);border-radius:8px 8px 0 0}
/* nav dropdown groups */
.navgrp{position:relative}
.grpbtn{background:none;border:none;color:var(--ink-2);padding:6px 12px;border-radius:8px;font-size:14px;font-weight:550;cursor:pointer;font-family:inherit}
.grpbtn:hover{background:color-mix(in srgb, var(--accent) 10%, transparent);color:var(--ink-1)}
.grpbtn.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);border-radius:8px 8px 0 0}
.grpbtn .caret{font-size:10px;opacity:.7}
.grpmenu{position:absolute;top:calc(100% + 4px);left:0;min-width:190px;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:6px;display:none;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.navgrp.open .grpmenu{display:block}
@media (hover:hover){ .navgrp:hover .grpmenu{display:block} }
.grpmenu a{display:block;padding:8px 12px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:550;white-space:nowrap}
.grpmenu a:hover{background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--ink-1)}
.grpmenu a.on{color:var(--accent)}
.theme-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--ink-2);padding:4px 10px;cursor:pointer;font-size:12.5px}
/* ---- cards & type ---- */
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:18px}
.card h2{font-size:17px;font-weight:700;margin:0 0 8px}
.card h3{font-size:14.5px;font-weight:650;margin:16px 0 6px}
.card p{margin:8px 0;color:var(--ink-1)}
.muted{color:var(--ink-3);font-size:12.5px}
.callout{border-left:3px solid var(--accent);padding:10px 14px;background:color-mix(in srgb, var(--accent) 6%, transparent);border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.callout.warn{border-left-color:var(--warn);background:color-mix(in srgb, var(--warn) 8%, transparent)}
a{color:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.03em;border-radius:6px;padding:2px 8px;margin-right:4px}
.pill.buy{background:color-mix(in srgb, var(--good) 14%, transparent);color:var(--good)}
.pill.fade{background:color-mix(in srgb, var(--bad) 13%, transparent);color:var(--bad)}
.pill.zrb{background:color-mix(in srgb, var(--accent) 13%, transparent);color:var(--accent)}
.pill.pos{background:color-mix(in srgb, var(--ink-3) 15%, transparent);color:var(--ink-2)}
/* ---- tables ---- */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
th.tl,td.tl{text-align:left}
td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
tr:last-child td{border-bottom:none}
/* ---- landing ---- */
.hero{padding:30px 0 6px;text-align:center;max-width:720px;margin:0 auto}
.hero img{width:min(330px,72vw);height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 10px 40px rgba(255,106,2,0.18))}
:root[data-theme="light"] .hero img{background:#0a0806;border-radius:18px;padding:14px;filter:none}
.hero .tagline{font-size:16.5px;color:var(--ink-2);margin:8px 0 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:26px}
.tile{display:block;text-decoration:none;color:var(--ink-1);background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:20px 22px;transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile h2{margin:0 0 6px;font-size:16.5px;font-weight:700}
.tile p{margin:0;color:var(--ink-2);font-size:13.5px}
.tile .go{display:block;margin-top:12px;color:var(--accent);font-size:13px;font-weight:600}
footer{color:var(--ink-3);font-size:12px;margin-top:26px;border-top:1px solid var(--grid);padding-top:14px}
footer a{color:var(--accent)}
/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.controls input[type=text]{background:var(--surface-1);color:var(--ink-1);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;width:220px}
.chip{border:1px solid var(--border);background:none;color:var(--ink-2);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--ink-2);padding:5px 12px;cursor:pointer;font-size:13px}
.btn:hover{color:var(--ink-1);border-color:var(--accent)}

</style>
<style>
.vh1{font-size:24px;font-weight:750;margin:6px 0 2px}
.controls2{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0 16px}
.controls2 label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;display:flex;gap:8px;align-items:center}
.controls2 select{background:var(--surface-1);color:var(--ink-1);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px}
.livechip{font-size:11.5px;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);border-radius:999px;padding:3px 10px;margin-left:auto}
.tiles2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile2{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile2 .tl2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.tile2 .tv2{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.tile2 .td2{font-size:11.5px;color:var(--ink-3)}
.vizgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.vizgrid{grid-template-columns:1fr}}
.vcard{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.vcard h2{font-size:15px;font-weight:700;margin:0 0 2px}
.vcard .note{color:var(--ink-3);font-size:12px;margin:0 0 10px}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:6px 0 2px}
.legend2 .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tooltip{position:fixed;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:10;display:none;max-width:260px}
.tooltip .tt-name{font-weight:650;margin-bottom:3px}
.tooltip .tt-row{display:flex;justify-content:space-between;gap:14px;color:var(--ink-2)}
.tooltip .tt-row b{color:var(--ink-1);font-variant-numeric:tabular-nums}
svg text{font-family:inherit}
.rostab td{padding:4px 8px}
</style>
</head>

  nav.appendChild(brand);
  const links = document.createElement("div"); links.className = "links";
  NAV.forEach(entry=>{
    if(entry.href){
      const a = document.createElement("a");
      a.href = entry.href; a.textContent = entry.label;
      if(entry.key===page) a.className = "on";

    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const wasOpen = grp.classList.contains("open");
      document.querySelectorAll(".navgrp.open").forEach(g=>g.classList.remove("open"));
      if(!wasOpen) grp.classList.add("open");
    });
    const menu = document.createElement("div"); menu.className = "grpmenu";

      const a = document.createElement("a");
      a.href = href; a.textContent = label;
      if(key===page) a.className = "on";
      menu.appendChild(a);
    });
    grp.appendChild(btn); grp.appendChild(menu);
    links.appendChild(grp);
  });

as", "pos": "WR", "team": "CHI", "full": 0, "half": 0, "sf": 0, "rank": 459, "silva": "", "tags": [], "note": ""}];
const LS_STATE="dd-auction-v1";
const POS_ORDER=["QB","RB","WR","TE","DST"];
const POS_COLOR={QB:"#e66767",RB:"#199e70",WR:"#3987e5",TE:"#c98500",DST:"#8a8378"};
const TIERS=[{k:"t20",label:"$20+",min:20,max:1e9,c:"#f26200"},
             {k:"t10",label:"$10–19",min:10,max:19.999,c:"#ff8a33"},
             {k:"t5",label:"$5–9",min:5,max:9.999,c:"#ffb377"},
             {k:"t1",label:"$1–4",min:1,max:4.999,c:"#ffe0c2"}];
const DEFAULT_TEAMS=[["Data Dawgs","Kap"],["Dirty Mike","Manzeo"],["Butts","Butts"],["Gonzo","Gonzo"],["Dan","Dan"],["Hoyt","Hoyt"],["JW","JW"],["Pat","Pat"],["Oliver","Oliver"],["Lowe","Lowe"],["Jay","Jay"],["Nick","Nick"],["Corrigan","Corrigan"],["Mark","Mark"]];

let S=null;
function load(){
  try{ S=JSON.parse(localStorage.getItem(LS_STATE)); }catch(e){ S=null; }
  if(!S) S={settings:{budget:200,spots:15,scoring:"half",teams:DEFAULT_TEAMS.map(t=>({name:t[0],owner:t[1]}))},picks:[]};
  if(!S.settings.scoring) S.settings.scoring="half";
}
const val=p=>+p[S.settings.scoring]||0;
const norm=p=>p==="D"?"DST":p;
const fmt$=n=>"$"+Math.round(n);
const esc=s=>{const d=document.createElement("span");d.textContent=s==null?"":String(s);return d.innerHTML;};

function derive(){
  const byName={}; POOL.forEach(p=>byName[p.name]=p);
  const sold={}; // name -> pick
  const T=S.settings.teams.map((t,ti)=>({...t,ti,spent:0,count:0,value:0,pos:{QB:0,RB:0,WR:0,TE:0,DST:0},posSpend:{QB:0,RB:0,WR:0,TE:0,DST:0},picks:[]}));
  (S.picks||[]).forEach(pk=>{
    const t=T[pk.ti]; if(!t) return;
    const P=norm(pk.pos);
    t.spent+=pk.price; t.count++; t.value+=(pk.etr||0);
    if(t.pos[P]!==undefined){t.pos[P]++; t.posSpend[P]+=pk.price;}
    t.picks.push(pk);
    sold[pk.player]=pk;
  });
  T.forEach(t=>{t.left=S.settings.budget-t.spent; t.surplus=t.value-t.spent;});
  const remDollars=T.reduce((a,t)=>a+Math.max(0,t.left),0);
  let remValue=0;
  const remaining=POOL.filter(p=>!sold[p.name]);
  remaining.forEach(p=>{ if(val(p)>=1) remValue+=val(p); });
  const infl=remValue>0?remDollars/remValue:1;
  return {T, sold, remaining, remDollars, remValue, infl, byName};
}

// ---------- tooltip ----------
const tt=document.getElementById("tt");
function showTT(x,y,name,rows){
  tt.textContent="";
  const h=document.createElement("div"); h.className="tt-name"; h.textContent=name; tt.appendChild(h);
  rows.forEach(([l,v])=>{
    const r=document.createElement("div"); r.className="tt-row";
    const a=document.createElement("span"); a.textContent=l;
    const b=document.createElement("b"); b.textContent=v;
    r.appendChild(a); r.appendChild(b); tt.appendChild(r);
  });
  tt.style.display="block";
  let px=x+14, py=y+14;
  if(px+tt.offsetWidth>innerWidth-8) px=x-tt.offsetWidth-14;
  if(py+tt.offsetHeight>innerHeight-8) py=y-tt.offsetHeight-14;
  tt.style.left=px+"px"; tt.style.top=py+"px";
}
function hideTT(){tt.style.display="none";}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function svgEl(t,a){const e=document.createElementNS("http://www.w3.org/2000/svg",t);for(const k in a)e.setAttribute(k,a[k]);return e;}

// ---------- charts ----------
function hBarChart(container, rows, opts){
  // rows: {label, color, segs:[{v,color,tt}] } — single seg = plain bar
  container.textContent="";
  const W=container.clientWidth||560, rowH=34, m={t:6,r:46,b:22,l:44};
  const H=m.t+rows.length*rowH+m.b;
  const maxV=Math.max(1,...rows.map(r=>r.segs.reduce((a,s)=>a+s.v,0)));
  const iw=W-m.l-m.r;
  const X=v=>m.l+v/maxV*iw;
  const svg=svgEl("svg",{width:"100%",height:H,viewBox:`0 0 ${W} ${H}`});
  const grid=css("--grid"), ink3=css("--ink-3"), ink1=css("--ink-1"), surf=css("--surface-1");
  // gridlines
  const step=Math.pow(10,Math.floor(Math.log10(maxV)));
  const tick=maxV/step>5?step*2:step;
  for(let v=tick;v<=maxV;v+=tick){
    svg.appendChild(svgEl("line",{x1:X(v),x2:X(v),y1:m.t,y2:H-m.b,stroke:grid,"stroke-width":1}));
    const t=svgEl("text",{x:X(v),y:H-6,"text-anchor":"middle","font-size":10,fill:ink3});
    t.textContent="$"+v; svg.appendChild(t);
  }
  rows.forEach((r,i)=>{
    const y=m.t+i*rowH+6, bh=Math.min(22,rowH-12);
    const lab=svgEl("text",{x:m.l-8,y:y+bh/2+4,"text-anchor":"end","font-size":12,fill:ink1,"font-weight":600});
    lab.textContent=r.label; svg.appendChild(lab);
    if(r.dot){ svg.appendChild(svgEl("circle",{cx:m.l-34,cy:y+bh/2,r:4,fill:r.dot})); }
    let x=m.l, total=0;
    r.segs.forEach((s,si)=>{
      if(s.v<=0) return;
      const w=Math.max(0.5, s.v/maxV*iw - (si<r.segs.length-1?2:0));
      const last = si===r.segs.length-1 || r.segs.slice(si+1).every(z=>z.v<=0);
      const rect=svgEl("rect",{x, y, width:w, height:bh, fill:s.color, rx:last?4:0});
      if(!last) rect.setAttribute("rx",0);
      svg.appendChild(rect);
      const hit=svgEl("rect",{x, y:y-4, width:Math.max(w,14), height:bh+8, fill:"transparent"});
      hit.addEventListener("pointermove",e=>showTT(e.clientX,e.clientY,s.ttName||r.label,s.tt));
      hit.addEventListener("pointerleave",hideTT);
      svg.appendChild(hit);
      x+=w+2; total+=s.v;
    });
    const vt=svgEl("text",{x:Math.min(x+4,W-4),y:y+bh/2+4,"font-size":11.5,fill:ink3,"font-variant-numeric":"tabular-nums"});
    vt.textContent=fmt$(total); svg.appendChild(vt);
  });
  container.appendChild(svg);
}

function cliffChart(container, players, sold, infl){
  container.textContent="";
  const W=container.clientWidth||1100, H=300, m={t:14,r:10,b:26,l:40};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;
  const n=players.length;
  const maxV=Math.max(1,...players.map(p=>val(p)));
  const bw=Math.max(2,Math.min(18, iw/n-2));
  const X=i=>m.l+i*(iw/n)+1;
  const Y=v=>m.t+ih-(v/maxV)*ih;
  const svg=svgEl("svg",{width:"100%",height:H,viewBox:`0 0 ${W} ${H}`});
  const grid=css("--grid"), ink3=css("--ink-3"), ink2=css("--ink-2"), surf=css("--surface-1");
  [0.25,0.5,0.75,1].forEach(f=>{
    const v=Math.round(maxV*f);
    svg.appendChild(svgEl("line",{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:grid,"stroke-width":1}));
    const t=svgEl("text",{x:m.l-6,y:Y(v)+4,"text-anchor":"end","font-size":10,fill:ink3});
    t.textContent="$"+v; svg.appendChild(t);
  });
  players.forEach((p,i)=>{
    const v=val(p), pk=sold[p.name];
    const color = pk ? css("--ink-3") : POS_COLOR[p.pos];
    const bar=svgEl("rect",{x:X(i), y:Y(v), width:bw, height:Math.max(1,m.t+ih-Y(v)),
      fill:color, rx:2, opacity: pk?0.35:1});
    svg.appendChild(bar);
    const hit=svgEl("rect",{x:X(i)-1, y:m.t, width:Math.max(bw+2, iw/n), height:ih, fill:"transparent"});
    const rows=[["ETR value",fmt$(v)],["Adj value",fmt$(Math.round(v*infl))]];
    if(pk){rows.push(["Sold for","$"+pk.price]); rows.push(["To", (S.settings.teams[pk.ti]||{}).name||"?"]);}
    else rows.push(["Status","AVAILABLE"]);
    hit.addEventListener("pointermove",e=>showTT(e.clientX,e.clientY,p.name,rows));
    hit.addEventListener("pointerleave",hideTT);
    svg.appendChild(hit);
  });
  // direct-label top 2 available
  let labeled=0;
  for(let i=0;i<n && labeled<2;i++){
    const p=players[i];
    if(!sold[p.name]){
      const t=svgEl("text",{x:Math.min(X(i)+bw/2, W-60), y:Y(val(p))-6,"text-anchor":"middle","font-size":10.5,fill:ink2,"font-weight":600,
        stroke:surf,"stroke-width":3,"paint-order":"stroke"});
      t.textContent=p.name.split(" ").slice(-1)[0]+" $"+val(p);
      svg.appendChild(t); labeled++;
    }
  }
  const xt=svgEl("text",{x:m.l+iw/2,y:H-6,"text-anchor":"middle","font-size":11,fill:ink3});
  xt.textContent="players ranked by ETR value →"; svg.appendChild(xt);
  container.appendChild(svg);
}

// ---------- render ----------
let scope=-1;
function render(){
  load();
  const d=derive();
  // scope select options
  const sel=document.getElementById("scopeSel");
  if(sel.options.length!==S.settings.teams.length+1){
    sel.innerHTML='<option value="-1">Whole league</option>'+S.settings.teams.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join("");
  }
  sel.value=String(scope);
  const pos=document.getElementById("posSel").value;
  const viz=document.getElementById("viz");
  const teamMode=scope>=0, T=teamMode?d.T[scope]:null;

  // tiles
  let tiles;
  if(!teamMode){
    const spent=d.T.reduce((a,t)=>a+t.spent,0);
    tiles=[["League spent",fmt$(spent),`${(S.picks||[]).length} picks`],
      ["League $ left",fmt$(d.remDollars),`of ${fmt$(S.settings.budget*d.T.length)}`],
      ["Value left on board",fmt$(d.remValue),"ETR $, players ≥$1"],
      ["Inflation",d.infl.toFixed(2)+"×", d.infl>1?"prices running hot":"value out there"],
      ["Avg $ left/team",fmt$(d.remDollars/d.T.length),""]];
  } else {
    tiles=[["Spent",fmt$(T.spent),`${T.count}/${S.settings.spots} drafted`],
      ["Budget left",fmt$(T.left),`${Math.max(0,S.settings.spots-T.count)} spots left`],
      ["ETR value acquired",fmt$(T.value),""],
      ["Surplus",(T.surplus>=0?"+":"−")+"$"+Math.abs(Math.round(T.surplus)),"value − spent"],
      ["Max sensible bid",fmt$(T.left),"$0 bids are legal, so ceiling = budget"]];
  }
  let html=`<div class="tiles2">${tiles.map(t=>`<div class="tile2"><div class="tl2">${t[0]}</div><div class="tv2">${t[1]}</div><div class="td2">${t[2]}</div></div>`).join("")}</div>`;

  html+=`<div class="vizgrid">
    <div class="vcard"><h2>Where the money went</h2>
      <p class="note">${teamMode?esc(T.name)+"'s":"League"} auction dollars by position${teamMode?"":" (all teams)"}.</p>
      <div id="chartSpend"></div></div>
    <div class="vcard"><h2>Value remaining, in tiers</h2>
      <p class="note">Sum of ETR $ still on the board per position, stacked by player tier. Hover a segment for the count.</p>
      <div id="chartTiers"></div>
      <div class="legend2">${TIERS.map(t=>`<span><span class="sw" style="background:${t.c}"></span>${t.label}</span>`).join("")}</div></div>
  </div>
  <div class="vcard" style="margin-bottom:16px"><h2>The cliff — ${pos==="DST"?"D/ST":pos} by value, drafted &amp; available</h2>
    <p class="note">Every ${pos==="DST"?"D/ST":pos} worth $1+, ranked by ETR value. <b style="color:${POS_COLOR[pos]}">Colored = available</b>, grey = gone. When the colored bars stop, that's the cliff.</p>
    <div id="chartCliff"></div></div>`;

  if(teamMode){
    html+=`<div class="vcard"><h2>${esc(T.name)} — roster</h2>
      <div style="overflow-x:auto"><table class="rostab"><thead><tr><th class="tl">Player</th><th>Pos</th><th>$</th><th>ETR</th><th>±</th></tr></thead><tbody>
      ${T.picks.map(pk=>{const dv=pk.etr?pk.price-pk.etr:null;
        return `<tr><td class="tl" style="font-weight:600">${esc(pk.player)}</td><td>${esc(norm(pk.pos))}</td><td>$${pk.price}</td><td>${pk.etr?"$"+pk.etr:"–"}</td>
        <td style="font-weight:700;color:${dv==null?"var(--ink-3)":dv>0?"var(--bad)":"var(--good)"}">${dv==null?"–":(dv>0?"+":"")+"$"+dv}</td></tr>`;}).join("")||'<tr><td class="tl muted">No picks yet</td></tr>'}
      </tbody></table></div></div>`;
  }
  viz.innerHTML=html;

  // chart: spend by position
  const spendRows=POS_ORDER.map(P=>{
    const v=teamMode?T.posSpend[P]:d.T.reduce((a,t)=>a+t.posSpend[P],0);
    const cnt=teamMode?T.pos[P]:d.T.reduce((a,t)=>a+t.pos[P],0);
    return {label:P==="DST"?"D":P, segs:[{v, color:POS_COLOR[P], ttName:(P==="DST"?"D/ST":P),
      tt:[["Spent",fmt$(v)],["Players bought",cnt]]}]};
  });
  hBarChart(document.getElementById("chartSpend"), spendRows, {});

  // chart: remaining value tiers
  const tierRows=POS_ORDER.map(P=>{
    const rem=d.remaining.filter(p=>p.pos===P);
    return {label:P==="DST"?"D":P, segs:TIERS.map(t=>{
      const ps=rem.filter(p=>val(p)>=t.min&&val(p)<=t.max);
      const v=ps.reduce((a,p)=>a+val(p),0);
      return {v, color:t.c, ttName:(P==="DST"?"D/ST":P)+" · "+t.label,
        tt:[["Value left",fmt$(v)],["Players",ps.length],["Best",ps.length?ps.sort((a,b)=>val(b)-val(a))[0].name:"—"]]};
    })};
  });
  hBarChart(document.getElementById("chartTiers"), tierRows, {});

  // cliff
  const cliffPlayers=POOL.filter(p=>p.pos===pos && (val(p)>=1 || d.sold[p.name])).sort((a,b)=>val(b)-val(a));
  cliffChart(document.getElementById("chartCliff"), cliffPlayers, d.sold, d.infl);
}

document.getElementById("scopeSel").addEventListener("change",e=>{scope=+e.target.value; render();});
document.getElementById("posSel").addEventListener("change",render);
addEventListener("storage",e=>{ if(e.key===LS_STATE) render(); });
addEventListener("resize",()=>render());
window.onThemeChange=()=>render();
render();
</script>
