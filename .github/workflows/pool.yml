name: forecast-pool
on: {schedule: [{cron: '30 13 * * 2'}], workflow_dispatch: {}}
jobs:
  pool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -m pipeline.pool "$(date -u +%F)"
