name: Bozo Menu production smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bozo-menu.html'
      - 'bozo-menu.mjs'
      - 'tools/smoke-bozo-menu.mjs'
      - '.github/workflows/bozo-menu-smoke.yml'
permissions:
  contents: read
jobs:
  public-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/smoke-bozo-menu.mjs
