name: forecast-resolve-grade
on: {schedule: [{cron: '15 4 * * *'}], workflow_dispatch: {}}
jobs:
  resolve_grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python -m pipeline.resolve "${{ inputs.cohort }}"
