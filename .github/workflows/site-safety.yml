      - "work/test-bozo-disclosures-ui.mjs"
      - "tests/service-worker.test.js"
      - "tests/live-state.test.js"
      - ".github/workflows/site-safety.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node work/test-dfs-page.js
      - run: node work/test-dfs-main-slate.cjs
      - run: npm install --prefix /tmp/dd-dfs-test jsdom@30.0.1 --no-audit --no-fund
      - run: DD_NODE_MODULES=/tmp/dd-dfs-test/node_modules node --test tests/nhl-ui.test.cjs tests/nhl-account.test.cjs
      - run: DDFS_JSDOM=/tmp/dd-dfs-test/node_modules/jsdom node work/test-agent-feedback-dom.mjs
      - run: DDFS_JSDOM=/tmp/dd-dfs-test/node_modules/jsdom node work/test-agent-board-dom.mjs
      - run: npm install --prefix /tmp/dd-feedback-pw playwright@1.56.1 --no-audit --no-fund
      - run: /tmp/dd-feedback-pw/node_modules/.bin/playwright install --with-deps chromium
      - run: DD_NODE_MODULES=/tmp/dd-feedback-pw/node_modules node work/test-agent-feedback-ui.mjs
      - run: DD_NODE_MODULES=/tmp/dd-feedback-pw/node_modules node work/test-agent-board-ui.mjs
      - run: DD_NODE_MODULES=/tmp/dd-feedback-pw/node_modules node work/test-bozo-disclosures-ui.mjs
      - run: DD_NODE_MODULES=/tmp/dd-feedback-pw/node_modules node work/test-bozo-diagnostics-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bozo-diagnostics-screenshots
          path: work/artifacts/bozo-diagnostics/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bozo-disclosure-screenshots
          path: work/artifacts/bozo-disclosures/*.png
          if-no-files-found: ignore
      - run: DDFS_JSDOM=/tmp/dd-dfs-test/node_modules/jsdom node --test tests/bozo-form-spread.test.cjs tests/bozo-spread-sign.test.js tests/bozo-price-sign.test.js tests/bozo-disclosures.test.cjs tests/bozo-diagnostics.test.cjs
      - run: DDFS_JSDOM=/tmp/dd-dfs-test/node_modules/jsdom node work/test-bozo-menu-ui.mjs
      - run: DDFS_JSDOM=/tmp/dd-dfs-test/node_modules/jsdom node work/test-dfs-autoload-ui.cjs
      - run: DDFS_JSDOM=/tmp/dd-dfs-test/node_modules/jsdom node work/test-dfs-workspace-ui.cjs
      - run: DDFS_JSDOM=/tmp/dd-dfs-test/node_modules/jsdom node work/test-dfs-ledger-ui.cjs
      - run: node tests/dfs-ledger.test.js
      - run: node --test tests/dfs-history-correctness.test.cjs
      - run: node --check sw.js
      - run: node --check dd-live-state.js
      - run: node --check warroom-weekly.js
      - run: node --test tests/service-worker.test.js tests/live-state.test.js tests/warroom-weekly.test.js
      - run: node --test tests/guillotine-weekly.test.cjs

  dfs-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/dfs-diagnostics.test.js tests/dfs-builder.test.js tests/dfs-draft.test.cjs tests/dfs-builder-sim.test.cjs tests/dfs-relationships.test.cjs tests/dfs-field-sim.test.cjs tests/dfs-simulation-contract.test.js tests/dfs-ledger.test.js tests/service-worker.test.js tests/dfs-showdown.test.js
      - run: npm install --prefix /tmp/dd-diagnostics-pw playwright@1.56.1 --no-audit --no-fund
      - run: /tmp/dd-diagnostics-pw/node_modules/.bin/playwright install --with-deps chromium
      - run: DD_NODE_MODULES=/tmp/dd-diagnostics-pw/node_modules NHL_QA_OUTPUT=artifacts/nhl node work/test-nhl-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhl-preview-screenshots
          path: artifacts/nhl
          if-no-files-found: ignore
      - run: PLAYWRIGHT_MODULE=/tmp/dd-diagnostics-pw/node_modules/playwright node tests/dfs-diagnostics.browser.cjs

      - run: PLAYWRIGHT_MODULE=/tmp/dd-diagnostics-pw/node_modules/playwright node tests/dfs-builder.browser.cjs
      - run: PLAYWRIGHT_MODULE=/tmp/dd-diagnostics-pw/node_modules/playwright node tests/dfs-relationships.browser.cjs
      - run: PLAYWRIGHT_MODULE=/tmp/dd-diagnostics-pw/node_modules/playwright node tests/dfs-entry.browser.cjs
      - run: node --test tests/nhl.test.cjs tests/nhl-snapshot.test.cjs tests/nhl-player-history.test.cjs tests/nhl-recipe.test.cjs tests/nhl-reviewed-slate.test.cjs
      - run: node work/test-nhl-workspace.mjs
      - run: node work/test-dfs-workspace.mjs
      - run: node work/test-dfs-draft-workspace.mjs
      - run: node work/test-dfs-portfolio-workspace.mjs
      - run: PLAYWRIGHT_MODULE=/tmp/dd-diagnostics-pw/node_modules/playwright node tests/dfs-portfolio.browser.cjs
      - run: PLAYWRIGHT_MODULE=/tmp/dd-diagnostics-pw/node_modules/playwright node tests/dfs-history.browser.cjs
      - run: node work/test-dfs-history-workspace.mjs
      - run: PLAYWRIGHT_MODULE=/tmp/dd-diagnostics-pw/node_modules/playwright node tests/dfs-account-history.browser.cjs
      - run: PLAYWRIGHT_MODULE=/tmp/dd-diagnostics-pw/node_modules/playwright node tests/dfs-showdown.browser.cjs
