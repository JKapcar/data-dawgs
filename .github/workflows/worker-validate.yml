name: Worker validation

on:
  pull_request:
    paths:
      - ".github/workflows/worker-validate.yml"
      # Any workflow change: a new scheduled or chained workflow must get a watchdog row
      # (work/test-survivor-pipeline.mjs derives the required list from these files).
      - ".github/workflows/**"
      - "dawg-bot-worker.js"
      - "bozo-menu.mjs"
      - "tests/bozo-menu*.test.mjs"
      - "tests/bozo-clv-estimate.test.cjs"
      - "tests/discord-*.test.cjs"
      - "tests/discord-*.test.mjs"
      - "tests/jobs*.test.cjs"
      - "tests/jobs*.test.mjs"
      - "tools/job-privacy-gate.mjs"
      - "jobs-core.js"
      - "wrangler.jsonc"
      - "tools/worker-config-guard.mjs"
      - "tests/worker-config-guard.test.mjs"
      - "work/**"
      - "tools/validate-data.js"
      - "data/**"

permissions:
  contents: read

concurrency:
  group: worker-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the committed Worker is assembled
        run: |
          cd work && node assemble.mjs && cd ..
          git diff --exit-code -- dawg-bot-worker.js
      - run: node --check dawg-bot-worker.js
      - run: node --test tests/bozo-capture-policy.test.cjs tests/bozo-exchange-evidence.test.cjs tests/bozo-effective-clv.test.cjs
      - run: node --test tests/worker-config-guard.test.mjs
      - run: node --test tests/jobs-deployment.test.mjs
      - run: node --test tests/bozo-clv-estimate.test.cjs
      - run: node --test tests/discord-bridge.test.cjs tests/discord-inbound.test.cjs tests/discord-owner-smoke.test.cjs tests/discord-pack.test.cjs tests/discord-pack-mcp.test.mjs tests/discord-grok-routine.test.cjs tests/discord-retrieval.test.cjs tests/discord-gateway.test.cjs tests/bozo-mcp-auth-status.test.js
      - run: node --test tests/dawg-pound.test.cjs
      - run: node --test tests/research-project.test.cjs
      - run: node --test tests/jobs.test.cjs tests/jobs-history.test.cjs tests/jobs-members.test.cjs tests/jobs-privacy.test.cjs tests/jobs-coordination.test.cjs tests/jobs-worker-logging.test.cjs
      - run: node --test tests/bozo-correction.test.cjs
      - run: node --test tests/bozo-menu*.test.mjs
      - run: node --test tests/bozo-sgo-diagnostics.test.js tests/bozo-sgo-capture.test.js
      - run: node work/test-espn-connections.mjs
      - run: node work/test-espn-setup.mjs
      - run: node work/test-sleeper-context.mjs
      - run: node work/test-warroom-isolation.mjs
      - run: node --test tests/warroom-weekly.test.js
      - run: node work/test-cfb-market-capture.mjs
      - run: node work/test-backup.mjs
      - run: node work/test-identity.mjs
      - run: node work/test-identity-league-foundation.mjs
      - run: node work/test-mcp.mjs
      - run: node work/test-agent-feedback.mjs
      - run: node work/test-agent-board.mjs
      - run: node --test tests/nhl.test.cjs
      - run: node work/test-nhl-workspace.mjs
      - run: node work/test-dfs-workspace.mjs
      - run: node work/test-dfs-portfolio-workspace.mjs
      - run: node work/test-dfs-history-workspace.mjs
      - run: node --test tests/dfs-history-correctness.test.cjs
      - run: node work/test-swoledawg.mjs
      - run: node work/test-bozo-close-fill.mjs
      - run: node work/test-bozo-autograde.mjs
      - run: node --test tests/bozo-royale-verdict.test.js tests/bozo-schedule-grade.test.js tests/gh-pacer.test.js
      - run: node --test tests/bozo-expected-margin.test.cjs tests/bozo-rule-safety.test.cjs tests/bozo-odds-api.test.js tests/bozo-unverified-entry.test.js
      - run: node work/test-bozo-sim.mjs
      - run: node work/test-bozo-clv-pipes.mjs
      - run: node work/test-bozo-override.mjs
      - run: node work/test-ops-health.mjs
      - run: node work/test-survivor-pipeline.mjs
      - run: node tools/validate-data.js
