name: Site pipeline health
# Full read-only health scan twice daily (UTC), plus explicit manual dispatch.
# Keep the filename stable for existing bookmarks. Producer completions do not wake it.
on:
  schedule:
    - cron: "35 12,23 * * *"
  workflow_dispatch:
    inputs:
      failure:
        description: "Failure evidence from a bot-dispatched producer"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: survivor-pipeline-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        with:
          script: |
            const watch = require('./work/survivor-pipeline-watch.cjs');
            await watch({github, context, core});
