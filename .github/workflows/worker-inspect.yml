name: worker-inspect

# Review this workflow AND its script before merging or manually dispatching.
# Existing credentials may have write powers; this code is deliberately GET-only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-inspect
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'JKapcar/data-dawgs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test synthetic fixtures without credentials
        run: node --test tests/worker-inspect.test.mjs
      - name: Inspect active toto metadata
        run: node tools/worker-inspect.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
