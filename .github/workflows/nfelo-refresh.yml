name: nfelo refresh

# Scheduled mirror of greerreNFL/nfelo published output into nfelo.html + data/nfelo.json.
#
# ⚠️ This is the ONLY thing in the repo that moves nfelo ratings and lines. nfl-data.yml
# installs `nfelodcm`, which is the schedule loader, not the model — do not read that
# workflow as a nfelo refresh. It is not one.
#
# ⚠️ Commits straight to main. data/nfelo.json is a dated mirror of a third party's
# output, not a receipt or a graded row, so the review-PR ceremony nfl-data.yml uses
# for canonical rows is not owed here. Every write is validated first and every row
# carries upstream commit sha + time, so a bad day is diffable and revertable.
#
# ⚠️ NEVER on push. Refresh on a schedule or by explicit dispatch only.
#
# Four pulls daily; every successful run wakes the receipt gate. No manual line pull.

on:
  schedule:
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nfelo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Exercise concurrent publication recovery
        run: python3 work/test-survivor-publish.py

      - name: Refresh from upstream
        run: node tools/nfelo-refresh.mjs

      - name: Verify upstream team aliases
        run: node work/test-nfelo-aliases.mjs

      - name: Rebuild survivor snapshot from the fresh mirror
        run: |
          node work/build-survivor-snapshot.mjs
          node tools/build-data.js survivor.json models.json

      - name: Stamp service worker, republish manifest, validate
        run: |
          set -euo pipefail
          if git diff --quiet -- nfelo.html survivor.html data/nfelo.json data/survivor.json data/models.json; then
            echo "nfelo unchanged — nothing to commit"
            exit 0
          fi
          python3 work/stamp-sw-version.py
          node tools/data-manifest.js
          node tools/validate-data.js
          git add nfelo.html survivor.html sw.js data/nfelo.json data/survivor.json data/models.json data/index.json
          node work/verify-sw.mjs

      - name: Commit if anything moved
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "nfelo mirror: $(node -e '
            const m=require("./data/nfelo.json").data.meta;
            process.stdout.write(`upstream ${m.sha} @ ${m.upstream_committed_at}`);
          ')"
          bash work/publish-survivor-pipeline.sh

      - name: Publish through GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash work/request-survivor-pages-build.sh
