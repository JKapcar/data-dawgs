name: Research lab contracts and preview
on:
  pull_request:
    paths: ['install-help.js', 'install-help.css', 'tests/install-help.test.mjs', 'tests/dawg-pound-ui.cjs', 'research-lab/**', 'dawg-pound.html', 'dawg-pound.js', 'signon.html', '.github/workflows/research-lab.yml']
permissions:
  contents: read
jobs:
  synthetic-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test research-lab/owner-apps.test.mjs research-lab/navigation-return.test.mjs research-lab/agent-setup.test.mjs research-lab/agent-integration.test.mjs research-lab/repair-owner-envelope.test.mjs research-lab/lab.test.mjs research-lab/gateway.test.mjs research-lab/upload.test.mjs research-lab/exact-store.test.mjs
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research-lab/inspect_zip_test.py
      - run: node research-lab/build-browser.mjs && git diff --exit-code -- research-lab/browser-engine.mjs
      - run: npm install --prefix /tmp/dd-lab-qa playwright@1.56.1 miniflare@4.20260730.0 --no-audit --no-fund
      - run: /tmp/dd-lab-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules node --test research-lab/owner-apps-worker.test.mjs research-lab/worker.test.mjs research-lab/upload-worker.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules node research-lab/hosted-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules node research-lab/public-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/upload-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/agent-setup-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/navigation-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/account-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/app-permissions-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node tests/install-help.test.mjs
      # Dawg Pound UI at 390/320 px; the header is compared pixel-for-pixel with the release-plan base commit.
      - run: git fetch --no-tags --depth=1 origin d5d48369a412fd7263c751e42b6108ba498a798a
      - run: POUND_PLAYWRIGHT_MODULE=/tmp/dd-lab-qa/node_modules/playwright POUND_SCREENSHOTS=/tmp/dd-lab-screenshots/pound node tests/dawg-pound-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-lab-preview
          path: /tmp/dd-lab-screenshots
