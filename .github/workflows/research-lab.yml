name: Research lab contracts and preview
on:
  pull_request:
    paths: ['install-help.js', 'install-help.css', 'tests/install-help.test.mjs', 'tests/dawg-pound-ui.cjs', 'tests/dispatch-visual-preview.cjs', 'tools/check-research-data.py', 'research-lab/**', 'dawg-pound.html', 'dawg-pound.js', 'pound-portraits.js', 'pound-portraits.css', 'signon.html', '.github/workflows/research-lab.yml']
permissions:
  contents: read
jobs:
  synthetic-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test research-lab/development-v3.test.mjs research-lab/development-index.test.mjs research-lab/development-data.test.mjs research-lab/owner-apps.test.mjs research-lab/navigation-return.test.mjs research-lab/agent-setup.test.mjs research-lab/agent-integration.test.mjs research-lab/repair-owner-envelope.test.mjs research-lab/lab.test.mjs research-lab/gateway.test.mjs research-lab/upload.test.mjs research-lab/archive-reconcile.test.mjs research-lab/exact-store.test.mjs
      - run: node --test research-lab/sourcebook.test.mjs research-lab/workflow.test.mjs
      - run: node --test tests/research-project.test.cjs research-lab/decision-controls.test.mjs research-lab/pound-portraits.test.mjs
      - run: node --test research-lab/robokap-core.test.mjs research-lab/robokap.test.mjs
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research-lab/inspect_zip_test.py
      - run: python research-lab/data/test_data_tools.py
      - run: python research-lab/data/test_development.py
      - run: python research-lab/data/test_full_development.py
      - run: python research-lab/data/test_wr_audit.py
      - run: python research-lab/data/test_indexed_development.py
      - run: python research-lab/data/test_indexed_population.py
      - run: python -m py_compile research-lab/data/verify_indexed_population.py
      - run: node --check research-lab/verify-local-development.mjs
      - run: node --check research-lab/verify-local-v3.mjs
      - run: python tools/check-research-data.py
      - run: node research-lab/build-browser.mjs && git diff --exit-code -- research-lab/browser-engine.mjs
      - run: npm install --prefix /tmp/dd-lab-qa playwright@1.56.1 miniflare@4.20260730.0 --no-audit --no-fund
      - run: /tmp/dd-lab-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/decisions-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/portraits-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/discord-smoke-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/workflow-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules node research-lab/workflow-hosted-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules node --test research-lab/discord-smoke-worker.test.mjs research-lab/portraits-worker.test.mjs research-lab/owner-apps-worker.test.mjs research-lab/worker.test.mjs research-lab/upload-worker.test.mjs research-lab/archive-reconcile-worker.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules node --test research-lab/robokap-worker.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/robokap-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules node research-lab/hosted-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules node research-lab/public-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/upload-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/agent-setup-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/navigation-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/account-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/app-permissions-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/private-browser.test.mjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node tests/install-help.test.mjs
      # Dispatch UI: retained navigation geometry and >=44px targets; synthetic work-first viewport checks.
      - run: git fetch --no-tags --depth=1 origin d5d48369a412fd7263c751e42b6108ba498a798a 3f2e03e0d49f69b0960efd7aed4dcbfcd781be14
      - run: POUND_PLAYWRIGHT_MODULE=/tmp/dd-lab-qa/node_modules/playwright POUND_SCREENSHOTS=/tmp/dd-lab-screenshots/pound node tests/dawg-pound-ui.cjs
      - run: POUND_PLAYWRIGHT_MODULE=/tmp/dd-lab-qa/node_modules/playwright DISPATCH_SCREENSHOTS=/tmp/dd-lab-screenshots/dispatch node tests/dispatch-visual-preview.cjs
      - run: DD_NODE_MODULES=/tmp/dd-lab-qa/node_modules LAB_SCREENSHOTS=/tmp/dd-lab-screenshots node research-lab/sourcebook-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-lab-preview
          path: /tmp/dd-lab-screenshots
