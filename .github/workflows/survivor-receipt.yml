name: survivor-receipt

# Capture the week's survivor recommendation BEFORE kickoff, and resolve last week's
# once the games are final.
#
# ⚠️ THIS IS THE WHOLE FEATURE. A receipt nobody captures is a spec, and the reason this
# is a cron rather than a note in a runbook is that the survivor snapshot spent seventeen
# days stale precisely because its refresh was a note in a runbook. If the capture is
# manual it will be forgotten in week 3 and the ledger will have a hole in it that can
# never be honestly filled — a backfilled receipt is not prospective.
#
# ⚠️ NEVER on push. This writes a dated claim, so it fires on a schedule or by explicit
# dispatch and nothing else. A capture triggered by an unrelated commit would stamp
# captured_at with whenever someone happened to push.
#
# Run daily and capture only inside 24 hours of the week's earliest kickoff. A fixed
# Thursday cron misses Wednesday Week 1, and the same edge recurs on Thanksgiving,
# Christmas and Saturday slates. A successful nfelo refresh also triggers this workflow
# so checkout sees the fresh survivor snapshot before it decides whether to capture.

on:
  schedule:
    - cron: "0 15 * * *"          # daily 15:00 UTC (11:00 ET); kickoff gate is below
  workflow_run:
    workflows: ["nfelo refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      week:
        description: "Week to capture (blank = derive from the schedule)"
        required: false
        default: ""
      resolve_only:
        description: "Only resolve finished weeks; capture nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: survivor-receipt
  cancel-in-progress: false

jobs:
  receipt:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Record exact snapshot read
        run: |
          git rev-parse HEAD
          sha256sum data/survivor.json data/survivor-receipts.json

      # Resolve first. Last week's games are final by Thursday, and resolving before
      # capturing means a failed capture still lands the grading it was owed.
      - name: Resolve anything that has finished
        id: resolve
        run: node work/survivor-receipt.mjs resolve

      - name: Work out which week to capture
        if: ${{ !inputs.resolve_only }}
        id: pick
        env:
          CAPTURE_WEEK: ${{ inputs.week }}
        run: node work/survivor-capture-gate.mjs >> "$GITHUB_OUTPUT"

      - name: Capture the upcoming week
        id: capture
        if: ${{ !inputs.resolve_only && steps.pick.outputs.week != '' && steps.pick.outputs.capture == 'true' }}
        continue-on-error: true
        env:
          CAPTURE_WEEK: ${{ steps.pick.outputs.week }}
        run: |
          set +e
          node work/survivor-receipt.mjs capture --week "$CAPTURE_WEEK" > "$RUNNER_TEMP/survivor-capture.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/survivor-capture.log"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Reject unexpected capture failures
        if: ${{ always() && steps.capture.outcome != 'skipped' && steps.capture.outcome != '' }}
        env:
          CAPTURE_CODE: ${{ steps.capture.outputs.code }}
        run: |
          test -n "$CAPTURE_CODE"
          node work/check-survivor-capture.mjs "$CAPTURE_CODE" "$RUNNER_TEMP/survivor-capture.log"

      - name: Republish the manifest
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        run: |
          if ! git diff --quiet -- data/survivor-receipts.json; then
            node tools/data-manifest.js
          fi

      - name: Validate before committing anything
        id: validate
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        run: node tools/validate-data.js

      - name: Commit if the ledger moved
        id: commit
        if: ${{ always() && steps.validate.outcome == 'success' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/survivor-receipts.json data/index.json; then
            echo "ledger unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/survivor-receipts.json data/index.json
          git commit -m "survivor receipts: $(node -e '
            const c=require("./data/survivor-receipts.json").counts;
            process.stdout.write(`${c.registered} registered, ${c.resolved} resolved`);
          ')"
          bash work/publish-survivor-pipeline.sh

      - name: Publish through GitHub Pages
        if: ${{ always() && steps.commit.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash work/request-survivor-pages-build.sh
