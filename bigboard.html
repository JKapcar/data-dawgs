// ---------- v4: speech-to-text pick entry ----------
const NUMWORD={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,
  twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
function parseSpeech(raw){
  const txt=raw.toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
  let tokens=txt.split(" ");
  const keeper=tokens.includes("keeper");
  tokens=tokens.filter(w=>!["to","for","goes","sold","dollars","dollar","bucks","keeper","the"].includes(w));
  // price: combine number words / digits, take the LAST number expression
  let price=null, priceIdx=[];
  for(let i=0;i<tokens.length;i++){
    const w=tokens[i];
    if(/^\d+$/.test(w)){ price=+w; priceIdx=[i]; }
    else if(w in NUMWORD){
      let v=NUMWORD[w], idxs=[i], j=i+1;
      while(j<tokens.length && tokens[j] in NUMWORD){
        const nv=NUMWORD[tokens[j]];
        if(nv===100) v=v*100; else v+=nv;
        idxs.push(j); j++;
      }
      price=v; priceIdx=idxs; i=j-1;
    }
  }
  tokens=tokens.filter((w,i)=>!priceIdx.includes(i));
  // team: find LAST occurrence of any team name/owner (multi-word phrases first)
  let ti=null, tSpan=null;
  S.settings.teams.forEach((t,idx)=>{
    [t.name,t.owner].forEach(label=>{
      if(!label) return;
      const lw=label.toLowerCase().split(/\s+/);
      for(let i=tokens.length-lw.length;i>=0;i--){
        if(lw.every((w,k)=>tokens[i+k]===w)){
          if(tSpan===null || i>tSpan[0] || (i===tSpan[0]&&lw.length>tSpan[1])){ ti=idx; tSpan=[i,lw.length]; }
          break;
        }
      }
    });
  });
  if(tSpan) tokens.splice(tSpan[0],tSpan[1]);
  // player: fuzzy match remaining tokens against pool
  const q=tokens.join(" ");
  let best=null,bestScore=0;
  if(q.length>=2){
    POOL.forEach(p=>{
      const pn=p.name.toLowerCase().replace(/[^a-z0-9' ]/g,"");
      const ptoks=pn.split(" ");
      let score=0;
      tokens.forEach(w=>{
        if(ptoks.includes(w)) score+=2;
        else if(ptoks.some(t=>t.startsWith(w)&&w.length>=3)) score+=1;
      });
      if(pn===q) score+=4;
      if(score>bestScore){bestScore=score;best=p;}
    });
  }
  return {player:best, playerScore:bestScore, rawPlayer:q, ti, price, keeper};
}

let recog=null, listening=false;
const MIC_ERRORS={
  "not-allowed":"Mic blocked. Click the mic/camera icon in Chrome's address bar → Allow, then retry.",
  "service-not-allowed":"Mic blocked by browser settings. Chrome Settings → Privacy → Site Settings → Microphone.",
  "audio-capture":"No microphone found. Check Chrome's mic device (address bar icon → mic dropdown).",
  "no-speech":"Didn't hear anything — mic is on, but no speech came through. Check input device/volume.",
  "network":"Speech service unreachable — Chrome's recognizer needs internet.",
  "aborted":"Listening cancelled."
};
function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return false;
  recog=new SR();
  recog.lang="en-US"; recog.interimResults=true; recog.maxAlternatives=1;
  recog.onresult=e=>{
    let interim="", final="";
    for(let i=0;i<e.results.length;i++){
      if(e.results[i].isFinal) final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    const hint=document.getElementById("entryHint");
    if(final) applySpeech(final.trim());
    else if(hint && interim) hint.textContent=`🎤 hearing: "${interim.trim()}…"`;
  };
  recog.onstart=()=>{
    const hint=document.getElementById("entryHint");
    if(hint) hint.textContent="🎤 Listening… say 'nominate {player}' or '{player}, {team}, {price}'";
  };
  recog.onend=()=>{ listening=false; const b=document.getElementById("micBtn"); if(b) b.classList.remove("listening"); };
  recog.onerror=e=>{
    listening=false;
    const b=document.getElementById("micBtn"); if(b) b.classList.remove("listening");
    const hint=document.getElementById("entryHint");
    if(hint) hint.textContent="🎤 "+(MIC_ERRORS[e.error]||("Error: "+e.error));
  };
  return true;
}
function applySpeech(heard){
  const r=parseSpeech(heard);
  const pin=document.getElementById("playerIn"), priceIn=document.getElementById("priceIn"),
        teamIn=document.getElementById("teamIn"), posIn=document.getElementById("posIn"),
        keepIn=document.getElementById("keeperIn"), hint=document.getElementById("entryHint");
  if(!pin) return;
  // NOMINATION: explicit keyword, or a player with no team and no price
  const nomWord=/nominat|on the block|up next|next up/.test(heard.toLowerCase());
  if(r.player && (nomWord || (r.ti===null && r.price===null && !r.keeper))){
    setBlock(r.player,{announceNow:true});
    pin.value=r.player.name; posIn.value=r.player.pos; window.__chosen=r.player;
    hint.textContent=`🎤 "${heard}" → 🔨 ${r.player.name} is ON THE BLOCK`;
    priceIn.focus();
    return;
  }
  // SALE: fall back to the on-block player if no player heard
  let player=r.player;
  if(!player && S.onBlock){ player=byName[S.onBlock.player]||{name:S.onBlock.player,pos:S.onBlock.pos}; }
  if(player){ pin.value=player.name; posIn.value=player.pos; window.__chosen=player; }
  else if(r.rawPlayer){ pin.value=r.rawPlayer; window.__chosen=null; }
  if(r.ti!==null) teamIn.value=String(r.ti);
  if(r.price!==null) priceIn.value=String(r.price);
  if(keepIn) keepIn.checked=r.keeper;
  const missing=[!player&&"player",r.ti===null&&"team",r.price===null&&"price"].filter(Boolean);
  hint.textContent=`🎤 "${heard}" → ${player?player.name:"??"} / ${r.ti!==null?(S.settings.teams[r.ti]||{}).name:"??"} / ${r.price!==null?"$"+r.price:"$??"}${missing.length?" — fix "+missing.join(", "):" — Enter to confirm"}`;
  (missing.includes("player")?pin:priceIn).focus();
}
function toggleMic(){
  if(!recog && !initSpeech()){
    const hint=document.getElementById("entryHint");
    if(hint) hint.textContent="Speech recognition not available in this browser.";
    return;
  }
  if(listening){ recog.stop(); return; }
  listening=true;
  document.getElementById("micBtn").classList.add("listening");
  try{ recog.start(); }catch(e){ listening=false; }
}

// Assign a team's picks to roster slots: QB, RB×2, WR×2, TE, FLX×2 (best remaining RB/WR/TE), DEF, bench (rest, price desc).
function assignSlots(picks){
  const norm=p=>p==="D"?"DST":p;
  const by={QB:[],RB:[],WR:[],TE:[],DST:[],K:[],OTH:[]};
  picks.forEach(p=>{ (by[norm(p.pos)]||by.OTH).push(p); });
  for(const k in by) by[k].sort((a,b)=>(b.price||0)-(a.price||0));
  const specs=S.settings.rosterSlots||[{slot:"QB",count:1},{slot:"RB",count:2},{slot:"WR",count:2},{slot:"TE",count:1},{slot:"FLEX",count:2},{slot:"DST",count:1},{slot:"BN",count:6}];
  const count=slot=>specs.filter(x=>x.slot===slot).reduce((n,x)=>n+(+x.count||0),0);
  const take=(arr,n)=>Array.from({length:n},()=>arr.shift()||null);
  const s={QB:take(by.QB,count("QB")),RB:take(by.RB,count("RB")),WR:take(by.WR,count("WR")),TE:take(by.TE,count("TE")),DST:take(by.DST,count("DST")),K:take(by.K,count("K"))};
  let flex=[...by.RB,...by.WR,...by.TE].sort((a,b)=>(b.price||0)-(a.price||0));
  s.FLEX=take(flex,count("FLEX"));
  const usedFlex=new Set(s.FLEX.filter(Boolean));
  by.RB=by.RB.filter(p=>!usedFlex.has(p)); by.WR=by.WR.filter(p=>!usedFlex.has(p)); by.TE=by.TE.filter(p=>!usedFlex.has(p));
  let superflex=[...by.QB,...by.RB,...by.WR,...by.TE].sort((a,b)=>(b.price||0)-(a.price||0));
  s.SUPERFLEX=take(superflex,count("SUPERFLEX"));
  const usedSF=new Set(s.SUPERFLEX.filter(Boolean));
  s.BN=[...by.QB,...by.RB,...by.WR,...by.TE,...by.DST,...by.K,...by.OTH].filter(p=>!usedSF.has(p)).sort((a,b)=>(b.price||0)-(a.price||0));
  return s;
}
function shortName(n){
  if(n.length<=16 || n.includes(" DST")) return n;
  const parts=n.split(" ");
  if(parts.length<2) return n;
  return parts[0][0]+". "+parts.slice(1).join(" ");
}

function renderLog(d){
  const t=document.getElementById("logT");
  const team=i=>S.settings.teams[i]?S.settings.teams[i].name:"?";
  t.innerHTML=`<thead><tr><th>#</th><th class="tl">Player</th><th>Pos</th><th class="tl">Team</th><th>$</th><th>MV</th><th>±</th><th></th><th></th></tr></thead>`;
  const tb=document.createElement("tbody");
  [...S.picks].reverse().forEach((pk,ri)=>{
    const i=S.picks.length-1-ri;
    const tr=document.createElement("tr");
    const diff = pk.etr!=null&&pk.etr>0 ? pk.price-pk.etr : null;
    tr.innerHTML=`<td class="rk">${i+1}</td>
      <td class="tl" style="font-weight:600">${esc(pk.player)} ${pk.keeper?'<span class="kpill">KEEPER</span>':""}</td>
      <td>${esc(pk.pos)}</td>
      <td class="tl"><select data-i="${i}" class="ed-team">${S.settings.teams.map((tm,ti)=>`<option value="${ti}" ${ti===pk.ti?"selected":""}>${esc(tm.name)}</option>`).join("")}</select></td>
      <td><input type="number" class="ed-price" data-i="${i}" value="${pk.price}" min="0"></td>
      <td>${pk.etr?fmt$(pk.etr):"–"}</td>
      <td class="diff ${diff==null?"":diff<0?"steal":diff>0?"over":""}">${diff==null?"–":(diff>0?"+":"")+"$"+diff}</td>
      <td><button class="del" data-i="${i}" title="delete">✕</button></td><td></td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  t.querySelectorAll(".ed-price").forEach(el=>el.addEventListener("change",e=>{
    const pk=S.picks[+el.dataset.i];
    const want=Math.max(0,Math.round(+el.value||0));
    // don't let an edit push a team past $0 either
    const spentElsewhere=S.picks.reduce((a,q,qi)=>a+(q.ti===pk.ti&&qi!==+el.dataset.i?q.price:0),0);
    const cap=S.settings.budget-spentElsewhere;
    pk.price=Math.min(want,Math.max(0,cap));
    save(); renderOp();
  }));
  t.querySelectorAll(".ed-team").forEach(el=>el.addEventListener("change",e=>{
    const pk=S.picks[+el.dataset.i]; pk.ti=+el.value;
    markTaken(pk.player, pk.ti===S.settings.myTeam); save(); renderOp();
  }));
  t.querySelectorAll(".del").forEach(el=>el.addEventListener("click",e=>{
    const pk=S.picks[+el.dataset.i];
    unmark(pk.player);
    S.picks.splice(+el.dataset.i,1); save(); renderOp();
  }));
}

function bindOp(d){
  const pin=document.getElementById("playerIn"), list=document.getElementById("acList"),
        posIn=document.getElementById("posIn"), teamIn=document.getElementById("teamIn"),
        priceIn=document.getElementById("priceIn"), keeperIn=document.getElementById("keeperIn"),
        hint=document.getElementById("entryHint");
  let chosen=null;

  function showAC(){
    const q=pin.value.trim().toLowerCase();
    if(q.length<2){ list.style.display="none"; acMatches=[]; acSel=-1; return; }
    acMatches=POOL.filter(p=>p.name.toLowerCase().includes(q)).slice(0,12);
    list.innerHTML=acMatches.map((p,i)=>{
      const sold=d.soldSet.has(p.name);
      return `<div class="acitem ${i===acSel?"sel":""} ${sold?"sold":""}" data-i="${i}">
        <span class="nm">${esc(p.name)}</span>
        <span class="meta">${p.pos} ${p.team}${p.silva?" · Silva "+p.silva:""}${p.tags&&p.tags.length?" · "+p.tags.join("/"):""}</span>
        ${sold?'<span class="soldtag">SOLD</span>':""}
        <span class="val">${fmt$(val(p))}</span></div>`;
    }).join("") || '<div class="acitem"><span class="meta">No match — custom player, set Pos manually</span></div>';
    list.style.display="block";
    list.querySelectorAll(".acitem[data-i]").forEach(el=>el.addEventListener("mousedown",ev=>{
      ev.preventDefault(); pick(+el.dataset.i);
    }));
  }
  function choose(p){
    if(!p) return;
    chosen=p; window.__chosen=p; pin.value=p.name; posIn.value=p.pos;
    document.getElementById("posWrap").style.display="none";
    list.style.display="none"; acSel=-1;
    if(d.soldSet.has(p.name)){
      hint.textContent="⚠ ALREADY SOLD — check the log";
    } else {
      hint.textContent=`MV ${fmt$(val(p))} · adj ${fmt$(Math.round(val(p)*d.infl))}${p.note?" · "+p.note:""}`;
      // selecting a player IS the nomination
      setBlock(p,{announceDelayed:true});
    }
    priceIn.focus();
  }
  function pick(i){ choose(acMatches[i]); }
  document.querySelectorAll(".sug[data-sug]").forEach(el=>el.addEventListener("click",()=>{
    choose(byName[el.dataset.sug]);
  }));
  pin.addEventListener("input",()=>{
    chosen=null; window.__chosen=null; hint.textContent=""; showAC();
    // custom-player pos picker only when nothing matches
    const q=pin.value.trim();
    document.getElementById("posWrap").style.display = (q.length>=2 && !byName[q] && acMatches.length===0) ? "" : "none";
  });
  if(!window.__escInstalled){
    window.__escInstalled=true;
    document.addEventListener("keydown",e=>{
      if(e.key!=="Escape") return;
      const list=document.getElementById("acList");
      if(list && list.style.display!=="none") return; // first Esc just closes the list
      const pin2=document.getElementById("playerIn"), price2=document.getElementById("priceIn");
      if(S.onBlock || (pin2&&pin2.value)){
        if(pin2) pin2.value=""; if(price2) price2.value="";
        window.__chosen=null; clearBlock();
        const hint2=document.getElementById("entryHint"); if(hint2) hint2.textContent="";
        if(pin2) pin2.focus();
      }
    });
  }
  pin.addEventListener("keydown",e=>{
    if(list.style.display!=="none"){
      if(e.key==="ArrowDown"){acSel=Math.min(acSel+1,acMatches.length-1);showAC();e.preventDefault();}
      else if(e.key==="ArrowUp"){acSel=Math.max(acSel-1,0);showAC();e.preventDefault();}
      else if(e.key==="Enter"){ if(acSel>=0) pick(acSel); else if(acMatches.length) pick(0); e.preventDefault();}
      else if(e.key==="Escape"){list.style.display="none";}
    }
  });
  pin.addEventListener("blur",()=>setTimeout(()=>list.style.display="none",150));
  priceIn.addEventListener("keydown",e=>{ if(e.key==="Enter") add(); });

  function add(){
    if(window.DDLeague&&DDLeague.current&&DDLeague.current.provider.syncMode==="live-read"){
      alert("Sleeper is authoritative for this league. Open Dashboard or Auctioneer and choose Take Over Manually before recording a Data Dawgs pick.");
      return;
    }
    const name=pin.value.trim();
    if(!name){ pin.focus(); return; }
    const p=chosen||byName[name];
    const price=Math.max(0,Math.round(+priceIn.value||0));
    const ti=+teamIn.value;
    // a team can never spend past $0 — that's an entry error, not a legal bid
    const tLeft=(d.T[ti]||{}).left;
    if(tLeft!=null && price>tLeft){
      hint.style.color="var(--bad)";
      hint.textContent=`⚠ ${(S.settings.teams[ti]||{}).name||"That team"} has only ${fmt$(tLeft)} left — max bid is ${fmt$(tLeft)}`;
      priceIn.focus(); priceIn.select();
      return;
    }
    hint.style.color="";
    const pk={player:p?p.name:name, pos:p?p.pos:posIn.value, ti, price,
              keeper:!!(keeperIn&&keeperIn.checked), etr:p?val(p):0, nfl:p?p.team:"", ts:Date.now()};
    S.picks.push(pk);
    if(!pk.keeper){
      S.nomIdx=(S.nomIdx+1)%S.settings.teams.length;
    }
    S.timerEnd=0;
    clearTimeout(blockTTSTimer);
    // pop from nomination queue if this player was queued
    const qi=S.queue.findIndex(n=>n.toLowerCase()===pk.player.toLowerCase());
    if(qi>=0) S.queue.splice(qi,1);
    // clear the block if this sale resolves it
    if(S.onBlock && S.onBlock.player.toLowerCase()===pk.player.toLowerCase()) S.onBlock=null;
    markTaken(pk.player, ti===S.settings.myTeam);
    save(); renderOp(); checkBrowns(); announce(pk);
    const npin=document.getElementById("playerIn"); npin.focus();
  }
  document.getElementById("addBtn").addEventListener("click",add);

  // undo is two-step: click arms an inline "are you sure", auto-disarms after 6s
  const undoEl=document.getElementById("undoLast"), confEl=document.getElementById("undoConf");
  if(undoEl && confEl){
    let armTimer=null;
    const disarm=()=>{ clearTimeout(armTimer); confEl.classList.remove("on"); undoEl.style.display=""; };
    undoEl.addEventListener("click",()=>{
      undoEl.style.display="none"; confEl.classList.add("on");
      clearTimeout(armTimer); armTimer=setTimeout(disarm,6000);
    });
    document.getElementById("undoNo").addEventListener("click",disarm);
    document.getElementById("undoYes").addEventListener("click",()=>{
      clearTimeout(armTimer);
      if(window.DDLeague&&DDLeague.current&&DDLeague.current.provider.syncMode==="live-read"){alert("Sleeper is authoritative. Take over manually before undoing a pick.");disarm();return;}
      const pk=S.picks.pop();
      if(!pk){ disarm(); return; }
      unmark(pk.player);
      if(!pk.keeper) S.nomIdx=(S.nomIdx-1+S.settings.teams.length)%S.settings.teams.length;
      save(); renderOp();
      const h=document.getElementById("entryHint");
      if(h){ h.style.color=""; h.textContent=`↶ Undid ${pk.player} ${fmt$(pk.price)} — back on the board`; }
    });
  }

  document.getElementById("nomBtn").addEventListener("click",()=>{
    S.nomIdx=(S.nomIdx+1)%S.settings.teams.length; save(); renderOp();
  });
  document.getElementById("lensSel").addEventListener("change",e=>{
    S.projView=e.target.value; save();
  });
  document.getElementById("micBtn").addEventListener("click",toggleMic);
  document.getElementById("menuBtn").addEventListener("click",()=>{
    window.__drawerOpen=!window.__drawerOpen;
    document.getElementById("menuDrawer").style.display=window.__drawerOpen?"":"none";
  });
  const aiB=document.getElementById("aiBtn");
  if(aiB) aiB.addEventListener("click",()=>window.DDBot && window.DDBot.toggle());
  bindBlockClear();
  if(!window.__vkeyInstalled){
    window.__vkeyInstalled=true;
    document.addEventListener("keydown",e=>{
      if(e.key==="v"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="SELECT"){ toggleMic(); }
    });
  }
  document.getElementById("qAdd").addEventListener("click",()=>{
    const qi=document.getElementById("qIn"); const v=qi.value.trim();
    if(v){ S.queue.push(v); save(); renderOp(); }
  });
  document.getElementById("qIn").addEventListener("keydown",e=>{
    if(e.key==="Enter"){ document.getElementById("qAdd").click(); }
  });
  document.querySelectorAll(".qx").forEach(el=>el.addEventListener("click",()=>{
    S.queue.splice(+el.dataset.i,1); save(); renderOp();
  }));
  document.querySelectorAll(".qn").forEach(el=>el.addEventListener("click",()=>{
    const npin=document.getElementById("playerIn");
    npin.value=el.dataset.n; npin.dispatchEvent(new Event("input")); npin.focus();
  }));
  document.getElementById("timerBtn").addEventListener("click",()=>{
    S.timerEnd=Date.now()+S.settings.timerSecs*1000; save(); renderOp();
  });
  document.getElementById("csvBtn").addEventListener("click",()=>{
    const head="pick,player,pos,team,owner,price,etr_value,keeper";
    const lines=S.picks.map((pk,i)=>{
      const t=S.settings.teams[pk.ti]||{};
      return [i+1,'"'+pk.player.replace(/"/g,'""')+'"',pk.pos,'"'+(t.name||"")+'"','"'+(t.owner||"")+'"',pk.price,pk.etr||"",pk.keeper?1:0].join(",");
    });
    const blob=new Blob([head+"\n"+lines.join("\n")],{type:"text/csv"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="data-dawgs-auction.csv"; a.click();
  });
  document.getElementById("resetBtn").addEventListener("click",e=>{
    if(!armReset){ armReset=true; e.target.textContent="Click again to RESET ALL"; e.target.classList.add("armred");
      setTimeout(()=>{armReset=false; if(document.contains(e.target)){e.target.textContent="Reset draft";e.target.classList.remove("armred");}},4000);
      return; }
    S.picks.forEach(pk=>unmark(pk.player));
    S=freshState(); armReset=false; save(); renderOp();
  });
  document.getElementById("setupBtn").addEventListener("click",()=>{
    const sp=document.getElementById("setupPanel");
    if(sp.style.display==="none"){ renderSetup(sp); sp.style.display=""; } else sp.style.display="none";
  });
  document.getElementById("recapBtn").addEventListener("click",()=>{
    const rb=document.getElementById("recapBox");
    if(rb.style.display==="none"){ renderRecap(rb); rb.style.display=""; } else rb.style.display="none";
  });
}

   <table><tbody>${S.settings.teams.map((t,i)=>`<tr><td>${i+1}</td>

  sp.querySelector("#voiceTest").addEventListener("click",()=>{

  });

function renderRecap(rb){
  const d=derive();
  const sales=S.picks.filter(p=>!p.keeper && p.etr>0);
  const byDiff=[...sales].sort((a,b)=>(a.price-a.etr)-(b.price-b.etr));
  const steals=byDiff.slice(0,5), overs=byDiff.slice(-5).reverse();
  const team=i=>S.settings.teams[i]?S.settings.teams[i].name:"?";
  const posSpend={};
  S.picks.forEach(pk=>{ posSpend[pk.pos]=(posSpend[pk.pos]||0)+pk.price; });
  const g=gradesData(d);
  rb.innerHTML=`<h3>Recap</h3>
   <div style="font-size:13px"><b>Report card</b>${g.map((r,i)=>`<div class="bestrow">${i+1}. ${esc(r.name)}<span style="color:${r.surplus>=0?"var(--good)":"var(--bad)"};font-size:12px">${r.surplus>=0?"+":"−"}$${Math.abs(Math.round(r.surplus))}</span><span class="val">${r.grade}</span></div>`).join("")}
   <b style="display:block;margin-top:8px">Biggest steals</b>${steals.map(p=>`<div class="bestrow">${esc(p.player)} — ${esc(team(p.ti))}<span class="val" style="color:var(--good)">−$${p.etr-p.price}</span></div>`).join("")||"<div class='muted'>—</div>"}
   <b style="display:block;margin-top:8px">Biggest overpays</b>${overs.filter(p=>p.price>p.etr).map(p=>`<div class="bestrow">${esc(p.player)} — ${esc(team(p.ti))}<span class="val" style="color:var(--bad)">+$${p.price-p.etr}</span></div>`).join("")||"<div class='muted'>—</div>"}
   <b style="display:block;margin-top:8px">$ by position</b>${Object.entries(posSpend).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<div class="bestrow">${p}<span class="val">${fmt$(v)}</span></div>`).join("")}
   <b style="display:block;margin-top:8px">Yahoo read-off (by team)</b>
   ${S.settings.teams.map((t,ti)=>{
      const ps=S.picks.filter(p=>p.ti===ti);
      if(!ps.length) return "";
      return `<div style="margin-top:4px"><b>${esc(t.name)}</b>: ${ps.map(p=>`${esc(p.player)} $${p.price}`).join(", ")}</div>`;
   }).join("")}</div>`;
}

// ---------- SUPER BOWL SUPER BROWNS ----------
let cbSeenTs=null;
function nflOf(pk){ if(pk.nfl) return pk.nfl; const p=byName[pk.player]; return p?p.team:""; }
function checkBrowns(){
  const last=S.picks.length?S.picks[S.picks.length-1]:null;
  if(cbSeenTs===null){ cbSeenTs=last?last.ts:0; return; }   // don't replay on page load
  if(last && last.ts>cbSeenTs){
    cbSeenTs=last.ts;
    if(!last.keeper && nflOf(last)==="CLE") celebrate(last);
  }
}
function celebrate(pk){
  const old=document.getElementById("celebrate"); if(old) old.remove();
  const o=document.createElement("div"); o.id="celebrate";
  o.innerHTML=`<canvas></canvas>
    <div class="cb-line cb-1">SUPER BOWL</div>
    <div class="cb-line cb-2">SUPER BROWNS</div>
    <div class="cb-p">${esc(pk.player)} · $${pk.price} · THE LAND HAS SPOKEN</div>`;
  document.body.appendChild(o);
  const cv=o.querySelector("canvas"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const COLS=["#ff3c00","#ffffff","#e8720c","#5c4033","#ffb27a"];
  const parts=Array.from({length:220},()=>({
    x:innerWidth/2+(Math.random()-.5)*innerWidth*.5, y:innerHeight*.62,
    vx:(Math.random()-.5)*16, vy:-(6+Math.random()*15),
    s:4+Math.random()*7, c:COLS[(Math.random()*COLS.length)|0],
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.35}));
  let frames=0;
  const iv=setInterval(()=>{
    frames++;
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6); ctx.restore();
    });
    if(frames>170){ clearInterval(iv); o.remove(); }
  }, 26);
}

// ---------- boot & sync ----------
function render(){ IS_PROJ ? renderProj() : renderOp(); checkBrowns(); if(window.DDTheme) window.DDTheme.apply(); }
addEventListener("storage",e=>{ if(e.key===LS_STATE){ load(); render(); } });
// Big Board can live on a second device: mirror the operator's state down to it
if(IS_PROJ && window.DDSync && window.DDSync.on){
  window.DDSync.subscribe(state=>{
    if(!state || !state.settings) return;
    try{ var __loc=JSON.parse(localStorage.getItem(LS_STATE)||"null"); }catch(e){ __loc=null; }
    // the mirror round-trips ~1s behind the operator: never overwrite a NEWER local copy
    if(!(__loc && +__loc.ts && +state.ts && +__loc.ts >= +state.ts)){
      try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); }catch(e){}
    }
    load(); render();
  });
}
if(IS_PROJ){ setInterval(()=>{ if(S.timerEnd>Date.now()-2000 && S.timerEnd>0) render(); }, 500); }
render();
